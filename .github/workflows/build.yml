name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Tag to build and publish as a release (e.g. v1.3.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to the path
        uses: microsoft/setup-msbuild@v2

      # Both configurations, because the pass condition for this repository is a clean rebuild of
      # each. There is no restore step: the projects are classic csproj with no package reference.
      - name: Build Debug
        run: msbuild BetterTerminal.sln /t:Rebuild /p:Configuration=Debug /p:Platform=x64 /v:minimal /warnaserror

      - name: Build Release
        run: msbuild BetterTerminal.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal /warnaserror

      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          # The one-file launcher is the headline distributable: it embeds and runs the whole app.
          Copy-Item BetterTerminal.Bootstrap\bin\x64\Release\BetterTerminal.exe dist
          # The same application, expanded, for anyone who prefers loose files.
          New-Item -ItemType Directory dist\app | Out-Null
          Copy-Item BetterTerminal.Shell\bin\x64\Release\*.exe dist\app
          Copy-Item BetterTerminal.Shell\bin\x64\Release\*.dll dist\app
          Copy-Item BetterTerminal.Wrap\bin\x64\Release\beterm-wrap.exe dist\app
          # The optional Windows service.
          New-Item -ItemType Directory dist\service | Out-Null
          Copy-Item BetterTerminal.Service\bin\x64\Release\beterm-service.exe dist\service
          Copy-Item README.md, LICENSE dist
          Compress-Archive -Path dist\* -DestinationPath BetterTerminal-x64.zip
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTerminal-x64
          path: BetterTerminal-x64.zip

      # A tag is what publishes. The token is the one the run is given; nothing is stored here.
      # Idempotent: if the release already exists (a re-run, or a re-pushed tag), the asset is
      # replaced instead of failing.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push sets the version from the ref; a manual run takes it from the input. The tag
          # is created at the built commit if it does not exist yet, so a manual run publishes even
          # when the tag event did not fire on its own.
          $tag = "${{ github.event.inputs.publish_tag }}"
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $notes = "Unpack anywhere and run BetterTerminal.exe - the single-file launcher that unpacks and runs the whole application, then cleans up. The loose application is also in app\, and the optional Windows service in service\. The first run installs a copy under %LOCALAPPDATA%\BetterTerminal and registers the beterm command; open a new prompt afterwards. Needs 64-bit Windows and .NET Framework 4.8. BETA."
          # A published version is a release, never a pre-release - so a release that already
          # exists is corrected as well, not only the ones this step creates.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag BetterTerminal-x64.zip --clobber
            gh release edit $tag --prerelease=false --latest
          } else {
            gh release create $tag BetterTerminal-x64.zip --title $tag --notes $notes --latest --target $env:GITHUB_SHA
          }
